version: 1
defaultProvider: github-copilot
defaultAgent: orchestrator

providers:
  github-copilot:
    type: github-copilot
    model: auto

routing:
  defaults: [github-copilot]
  fallback:
    enabled: true
    maxAttempts: 2
  rules: []

git:
  host: gitlab
  baseUrl: https://gitlab.metropol-it.at
  project: varga.pter91/etnpilot
  remote: gitlab
  targetBranch: main
  webhook:
    path: /webhooks/gitlab
    host: 127.0.0.1
    port: 8787
    maxBodyBytes: 1048576
    timestampToleranceSeconds: 300
    deliveryStore: .etnpilot/state/webhooks
  issueTrigger:
    enabled: false
    labels: [etnpilot]
    actions: [open, reopen]
    allowConfidential: false
    publish: false
    syncStatus: true
    comment: false

codegraph:
  database: .etnpilot/state/codegraph.sqlite
  autoIndex: true
  maxImpactDepth: 20

approval:
  allow: [read]
  requireHuman: [write, shell, network]
  inbox:
    enabled: true
    database: .etnpilot/state/approvals.sqlite
    timeoutMs: 86400000
    pollIntervalMs: 500

policy:
  operations:
    default: deny
    rules:
      - id: protect-credentials
        effect: deny
        kinds: [read, write]
        paths: [.env, .env.*, "**/.env", "**/.env.*", .npmrc, "**/.npmrc", .netrc, "**/.netrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/id_rsa", "**/id_ed25519", .git, .git/**, .etnpilot/keys, .etnpilot/keys/**, .etnpilot/secrets, .etnpilot/secrets/**]
      - id: read-project
        effect: allow
        kinds: [read]
        paths: ["**"]
      - id: write-project
        effect: human
        kinds: [write]
        paths: ["**"]
      - id: shell-with-review
        effect: human
        kinds: [shell]
      - id: approved-network-targets
        effect: human
        kinds: [network]
        hosts: [gitlab.metropol-it.at, github.com, api.github.com]
  providers:
    default: deny
    rules:
      - id: configured-copilot
        effect: allow
        providers: [github-copilot]

workspace:
  mode: worktree
  cleanup: never

plugins: []

workflow:
  concurrency: 1
  failFast: true
  timeoutMs: 1800000
  maxSteps: 50
  steps:
    - id: plan
      type: agent
      agent: orchestrator
    - id: build
      type: agent
      agent: builder
      needs: [plan]
    - id: test
      type: check
      name: unit-tests
      command: [npm, test]
      needs: [build]
    - id: review
      type: agent
      agent: reviewer
      needs: [build, test]
