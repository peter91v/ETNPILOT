version: 1
defaultProvider: github-copilot
defaultAgent: orchestrator

providers:
  github-copilot:
    type: github-copilot
    model: auto

git:
  host: gitlab
  baseUrl: https://gitlab.metropol-it.at
  project: varga.pter91/etnpilot
  remote: gitlab
  targetBranch: main

codegraph:
  database: .etnpilot/state/codegraph.sqlite

approval:
  allow: [read]
  requireHuman: [write, shell, network]

plugins: []

workflow:
  concurrency: 1
  failFast: true
  timeoutMs: 1800000
  maxSteps: 50
  steps:
    - id: plan
      type: agent
      agent: orchestrator
    - id: build
      type: agent
      agent: builder
      needs: [plan]
    - id: test
      type: check
      name: unit-tests
      command: [npm, test]
      needs: [build]
    - id: review
      type: agent
      agent: reviewer
      needs: [build, test]
