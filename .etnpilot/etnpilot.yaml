version: 1
settings:
  # What a user may change on their own machine. Local changes land in
  # .etnpilot/etnpilot.local.yaml or ~/.config/etnpilot/config.yaml and are
  # never committed. See docs/settings.md.
  modes:
    "settings.**": locked
    "secrets.**": locked
    "content.provenance.**": locked
    "receipts.signing.**": locked
    "supplyChain.**": locked
    "policy.**": stricter-only
    "approval.allow": stricter-only
    "approval.requireHuman": stricter-only
    "checks.envAllow": stricter-only
    "sandbox.enabled": stricter-only
# Which provider the agents use. Change it on your own machine with
# 'etnpilot config set defaultProvider github-copilot' — that stays local and
# is never committed. Each one needs its own credential:
#   github-copilot  a Copilot subscription (no SDK build exists for Android)
#   openai          OPENAI_API_KEY
#   anthropic       ANTHROPIC_API_KEY
defaultProvider: openai
defaultAgent: orchestrator

providers:
  github-copilot:
    type: github-copilot
    model: auto
  openai:
    type: openai-compatible
    baseUrl: https://api.openai.com/v1
    model: gpt-5
    apiKeySecret: openai.apiKey
    tools: true
  anthropic:
    type: anthropic
    baseUrl: https://api.anthropic.com
    model: claude-opus-5
    tools: true
    maxTokens: 8192

routing:
  # Empty on purpose: the route is 'defaultProvider', so that one setting is
  # enough to switch and nothing here quietly outranks it.
  defaults: []
  fallback:
    enabled: true
    maxAttempts: 2
  rules: []

git:
  host: gitlab
  baseUrl: https://gitlab.metropol-it.at
  project: varga.pter91/etnpilot
  remote: gitlab
  targetBranch: main
  webhook:
    path: /webhooks/gitlab
    host: 127.0.0.1
    port: 8787
    maxBodyBytes: 1048576
    timestampToleranceSeconds: 300
    deliveryStore: .etnpilot/state/webhooks
  issueTrigger:
    enabled: false
    labels: [etnpilot]
    actions: [open, reopen]
    allowConfidential: false
    publish: false
    syncStatus: true
    comment: false

secrets:
  providers:
    env:
      type: env
      # Only these variables are readable. A name that is missing here is not
      # read, however it is referenced below.
      allow:
        - ETNPILOT_GITLAB_TOKEN
        - ETNPILOT_GITLAB_WEBHOOK_SIGNING_SECRET
        - ETNPILOT_GITLAB_WEBHOOK_TOKEN
        - ETNPILOT_GITHUB_TOKEN
        - ETNPILOT_PROVIDER_API_KEY
        - OPENAI_API_KEY
        - ANTHROPIC_API_KEY
        - ETNPILOT_OTLP_HEADERS
  values:
    gitlab.apiToken: { provider: env, key: ETNPILOT_GITLAB_TOKEN }
    gitlab.webhookSigningSecret: { provider: env, key: ETNPILOT_GITLAB_WEBHOOK_SIGNING_SECRET }
    gitlab.webhookToken: { provider: env, key: ETNPILOT_GITLAB_WEBHOOK_TOKEN }
    github.token: { provider: env, key: ETNPILOT_GITHUB_TOKEN }
    provider.apiKey: { provider: env, key: ETNPILOT_PROVIDER_API_KEY }
    openai.apiKey: { provider: env, key: OPENAI_API_KEY }
    anthropic.apiKey: { provider: env, key: ANTHROPIC_API_KEY }
    observability.otlpHeaders: { provider: env, key: ETNPILOT_OTLP_HEADERS }

codegraph:
  enabled: true
  autoIndex: true
  maxImpactDepth: 20
  startupTimeoutMs: 30000
  tools: [codegraph_explore]

content:
  provenance:
    mode: enforce
    lockFile: .etnpilot/content-lock.json
    verifyAfterRun: true
    maxEntries: 1000
    maxFileBytes: 1048576

observability:
  enabled: true
  file: .etnpilot/state/telemetry.jsonl
  serviceName: etnpilot
  environment: development
  failureMode: ignore
  otlp:
    enabled: false
    endpoint: http://127.0.0.1:4318/v1/traces
    timeoutMs: 5000
  pricing:
    currency: USD
    models: {}
  budgets: {}

approval:
  allow: [read]
  requireHuman: [write, shell, network]
  inbox:
    enabled: true
    database: .etnpilot/state/approvals.sqlite
    timeoutMs: 86400000
    pollIntervalMs: 500

policy:
  operations:
    default: deny
    rules:
      - id: protect-credentials
        effect: deny
        kinds: [read, write]
        paths: [.env, .env.*, "**/.env", "**/.env.*", .npmrc, "**/.npmrc", .netrc, "**/.netrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/id_rsa", "**/id_ed25519", .git, .git/**, .etnpilot/keys, .etnpilot/keys/**, .etnpilot/secrets, .etnpilot/secrets/**]
      - id: read-project
        effect: allow
        kinds: [read]
        paths: ["**"]
      - id: write-project
        effect: human
        kinds: [write]
        paths: ["**"]
      - id: shell-with-review
        effect: human
        kinds: [shell]
      - id: approved-network-targets
        effect: human
        kinds: [network]
        hosts: [gitlab.metropol-it.at, github.com, api.github.com]
  providers:
    default: deny
    rules:
      - id: configured-providers
        effect: allow
        providers: [github-copilot, openai, anthropic]

workspace:
  mode: worktree
  cleanup: never

pluginIsolation:
  setupTimeoutMs: 10000
  callTimeoutMs: 30000
  shutdownTimeoutMs: 1000
  memoryMb: 128
  maxOutputBytes: 65536
  maxMessageBytes: 1048576
  maxPendingRequests: 32
  memoryPollIntervalMs: 100

plugins: []

workflow:
  concurrency: 1
  failFast: true
  timeoutMs: 1800000
  maxSteps: 50
  steps:
    - id: plan
      type: agent
      agent: orchestrator
    - id: build
      type: agent
      agent: builder
      needs: [plan]
      # This step is here to change the repository. An agent that answers
      # without calling a tool has not done it, however well it describes what
      # it would have done.
      expect: tool-use
    - id: test
      type: check
      name: unit-tests
      command: [npm, test]
      needs: [build]
    - id: review
      type: agent
      agent: reviewer
      needs: [build, test]
