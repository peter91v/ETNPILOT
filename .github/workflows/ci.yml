name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest]
        include:
          # The one documented real use ran on Node 26 on arm64 (Android);
          # x64 alone could not have caught the five faults of 23 September.
          - node: 26
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node bin/etnpilot.js scan secrets
      - run: node bin/etnpilot.js deps check
