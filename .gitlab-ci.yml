default:
  image: node:24

stages: [test]

test:
  stage: test
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  script:
    - npm ci
    - npm run check
    - node bin/etnpilot.js scan secrets
    - node bin/etnpilot.js deps check
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
